name: Run Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"
      - name: Install dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix client
      - name: Run tests
        run: npm run test
