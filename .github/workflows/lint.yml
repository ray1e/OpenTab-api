name: Lint

on:
  push:
  pull_request:

permissions:
  checks: write
  contents: write
  actions: write

jobs:
  run-linters:
    name: Run linters
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint:fix
